---
# Every audit is on by default. The `unpinned-uses` audit applies to every org without exception,
# including actions/* and camunda/*, because a tag is a moving target its owner can repoint at any time.
rules:
  # Wants `uses: $/...` for local actions, which actionlint rejects ("ref is missing").
  # Re-enable once actionlint accepts the self-repository syntax.
  self-repository:
    disable: true
