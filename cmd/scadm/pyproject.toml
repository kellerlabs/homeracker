[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scadm"
version = "0.10.1"
description = "OpenSCAD dependency manager - Install OpenSCAD and manage library dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Patrick Pötz", email = "kellervater@gmail.com"}
]
keywords = ["openscad", "dependency-manager", "3d-modeling", "scad", "libraries"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/kellerlabs/homeracker"
Repository = "https://github.com/kellerlabs/homeracker"
Documentation = "https://github.com/kellerlabs/homeracker/tree/main/cmd/scadm"
Issues = "https://github.com/kellerlabs/homeracker/issues"
Changelog = "https://github.com/kellerlabs/homeracker/blob/main/cmd/scadm/CHANGELOG.md"

[project.scripts]
scadm = "scadm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scadm*"]

[tool.setuptools.package-data]
scadm = ["py.typed"]

[tool.pytest.ini_options]
# With PYTHONWARNDEFAULTENCODING=1, text I/O without an explicit encoding fails (breaks on non-UTF-8 Windows locales).
filterwarnings = ["error::EncodingWarning"]
markers = [
    "integration: CLI integration tests (require network, run with -m integration)",
    "slow: slow tests that download binaries (run with -m slow)",
]

[tool.coverage.run]
source = ["scadm"]
branch = true

[tool.coverage.report]
# Raise when coverage grows, never lower. See docs/decisions/gate-scadm-coverage-and-mutation-test-changed-functions.md
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.mutmut]
source_paths = ["scadm/"]
pytest_add_cli_args = ["-m", "not integration"]
pytest_add_cli_args_test_selection = ["tests/"]
# Mutants no test should pin: log output, argparse help and usage text, exception messages.
do_not_mutate_patterns = [
    'logger\.\w+\(',
    '^\s*(help|description|metavar|prog)=',
    'raise \w+\(',
]
