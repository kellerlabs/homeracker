---
name: Integration Tests

on:
  pull_request:
    paths:
      - 'cmd/scadm/**'
      - 'scadm.json'
      - '.github/workflows/integration-tests.yml'
      - '.github/actions/setup-openscad/**'

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install scadm from source
        run: pip install -e cmd/scadm pytest pytest-timeout

      - name: Install OpenSCAD AppImage dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 libegl1 libopengl0 libgl1 libglx0

      - name: Install Mesa3D (Windows software OpenGL)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0

      - name: Run integration tests
        shell: bash
        run: |
          set -euo pipefail
          cd cmd/scadm
          python -m pytest tests/test_cli_integration.py -m integration -v --timeout=300
