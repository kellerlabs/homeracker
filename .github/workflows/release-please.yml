---
name: Handle Release PRs

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASES_APP_ID }}
          private-key: ${{ secrets.RELEASES_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Handle Release Creation
        uses: camunda/infra-global-github-actions/teams/infra/pull-request/release@7fe5cca167f7826bedbc078ae36ff2e974cc8cb5 # pull-request-1.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
