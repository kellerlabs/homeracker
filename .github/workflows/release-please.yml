---
name: Handle Release PRs

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASES_APP_ID }}
          private-key: ${{ secrets.RELEASES_APP_PRIVATE_KEY }}

      - name: Handle Release Creation
        uses: camunda/infra-global-github-actions/teams/infra/pull-request/release@d56c158341637cc71ed42e34040e9db0d0026b6c # pull-request-1.1.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
