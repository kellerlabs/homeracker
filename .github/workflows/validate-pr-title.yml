---
name: Validate PR Title

# Required directly next to check-results: it runs on title edits, which ci.yml does not.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-title:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate PR title
        uses: camunda/infra-global-github-actions/teams/infra/pull-request/validate-title@405ecc95af077cd030bfe3249511e802fd9e4585 # pull-request-1.1.3
        with:
          # Keep in sync with .github/config/release-please-config.json changelog-sections
          types: |
            feat
            feat!
            fix
            fix!
            deps
            docs
            ci
            test
            chore
            refactor
