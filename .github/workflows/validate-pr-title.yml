---
name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: camunda/infra-global-github-actions/teams/infra/pull-request/validate-title@d56c158341637cc71ed42e34040e9db0d0026b6c # pull-request-1.1.0
        with:
          # Keep in sync with .github/config/release-please-config.json changelog-sections
          types: |
            feat
            feat!
            fix
            fix!
            deps
            docs
            ci
            test
            chore
            refactor
