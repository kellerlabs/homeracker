---
name: Web

on:
  pull_request:
    paths:
      - 'configurator/**'
      - 'site/**'
      - 'models/**/*.scad'
      - 'README.md'
      - 'models/**/README.md'
      - '.github/workflows/web.yml'
      - '.github/actions/setup-openscad/**'
  push:
    branches:
      - main
    paths:
      - 'configurator/**'
      - 'site/**'
      - 'models/**/*.scad'

jobs:
  configurator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: configurator

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OpenSCAD
        uses: ./.github/actions/setup-openscad
        with:
          scadm-source: cmd/scadm

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          PARTS_REQUIRED: "1"
        run: npm run build

      - name: Read Playwright version
        id: playwright
        run: |
          set -euo pipefail
          echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # Headless tests only need the headless shell, not the full Chrome build.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests
        env:
          PARTS_REQUIRED: "1"
        run: npm run e2e

      # Previews are served from a subpath, where a root-relative link or asset path breaks.
      - name: Build for a preview subpath
        env:
          SITE_BASE: /preview/pr-0/
        run: npm run build:site

      - name: E2E tests under a preview subpath
        env:
          PARTS_REQUIRED: "1"
          SITE_BASE: /preview/pr-0/
        run: npm run e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
...
