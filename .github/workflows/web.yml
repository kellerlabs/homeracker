---
name: Web

on:
  pull_request:
    paths:
      - 'configurator/**'
      - 'site/**'
      - 'models/**/*.scad'
      - 'README.md'
      - 'models/**/README.md'
      - '.github/workflows/web.yml'
  push:
    branches:
      - main
    paths:
      - 'configurator/**'
      - 'site/**'
      - 'models/**/*.scad'

jobs:
  configurator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: configurator

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenSCAD
        uses: ./.github/actions/setup-openscad
        with:
          scadm-source: cmd/scadm

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          PARTS_REQUIRED: "1"
        run: npm run build
...
