---
name: Sync Agent Instructions
description: >
  Download the canonical agent instruction set from kellerlabs/homeracker
  and overwrite local copies. Does not commit, the caller handles git operations.

inputs:
  ref:
    description: Branch or tag to sync from (e.g., main, sync-instructions-v1.0.0).
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Sync instructions
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: bash "$GITHUB_ACTION_PATH/sync-instructions.sh" "$REF"
